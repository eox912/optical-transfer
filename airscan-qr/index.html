<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 刻意不加 CSP meta：uTools 以本地协议加载页面，origin 是 opaque 的，
         script-src 'self' 会把 index.js 直接拦掉 → 白屏（PLUGIN-SPEC §3.1）。 -->
    <title>AirScan 隔空传输</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="app">
      <header class="hero">
        <img class="hero__logo" src="logo.png" alt="logo" />
        <div class="hero__meta">
          <h1 class="hero__title">AirScan 隔空传输</h1>
          <p class="hero__sub" id="hero-sub">顺序分片轮播 · 零依赖 · 无需构建</p>
        </div>
        <span class="badge" id="env-badge">PROD</span>
      </header>

      <main class="cards">
        <section class="card">
          <header class="card__head"><h2 class="card__title">1 · 要发送什么</h2></header>
          <div class="card__body">
            <div class="dropzone" id="dropzone">
              <p class="dropzone__text" id="dropzone-text">把文件拖到这里，或点下面的按钮</p>
              <div class="actions">
                <button class="btn btn--primary" id="pick-file" type="button">选择文件</button>
                <button class="btn" id="toggle-text" type="button">改用文本</button>
                <button class="btn btn--ghost" id="clear-payload" type="button" hidden>清除</button>
              </div>
              <input type="file" id="file-input" multiple hidden />
            </div>

            <div id="text-box" hidden>
              <label class="field">
                <span class="field__label">文本内容（按 UTF-8 编码后传输）</span>
                <textarea id="text-input" rows="4" placeholder="要隔空传过去的文字…"></textarea>
              </label>
              <label class="field">
                <span class="field__label">接收端保存的文件名</span>
                <input type="text" id="text-name" value="message.txt" />
              </label>
            </div>

            <ul class="file-list" id="file-list"></ul>
            <dl class="kv" id="payload-info"></dl>
          </div>
        </section>

        <section class="card">
          <header class="card__head"><h2 class="card__title">2 · 传输参数</h2></header>
          <div class="card__body">
            <label class="field">
              <span class="field__label">编码模式（默认招牌模式：顺序分片轮播）</span>
              <select id="opt-mode"></select>
            </label>
            <p class="hint" id="mode-blurb"></p>
            <div class="grid2">
              <label class="field">
                <span class="field__label">分片大小</span>
                <select id="opt-symbol"></select>
              </label>
              <label class="field">
                <span class="field__label">帧率</span>
                <select id="opt-fps"></select>
              </label>
              <label class="field">
                <span class="field__label">QR 纠错等级</span>
                <select id="opt-ecc"></select>
              </label>
              <label class="field">
                <span class="field__label">描述符间隔（每 N 帧插一次）</span>
                <select id="opt-repeat"></select>
              </label>
            </div>
            <label class="field">
              <span class="field__label">智能补发比例 <b id="repair-value">0%</b></span>
              <input type="range" id="opt-repair" min="0" max="50" step="5" value="0" />
            </label>
            <p class="hint" id="repair-hint"></p>
          </div>
        </section>

        <section class="card">
          <header class="card__head"><h2 class="card__title">3 · 传输计划</h2></header>
          <div class="card__body">
            <dl class="kv" id="plan"></dl>
            <p class="hint" id="plan-hint"></p>
          </div>
        </section>

        <section class="card">
          <header class="card__head"><h2 class="card__title">4 · 开始</h2></header>
          <div class="card__body">
            <div class="actions">
              <button class="btn btn--primary" id="start-send" type="button">显示动态码</button>
              <button class="btn" id="open-receiver" type="button">打开扫码接收窗口</button>
            </div>
            <p class="hint">
              码窗会铺满主显示器并置顶。发送端不知道接收端的真实进度（光学信道是单向的），
              所以码窗上的百分比只是"已播放"的进度。
            </p>
          </div>
        </section>

        <section class="card" id="progress-card" hidden>
          <header class="card__head"><h2 class="card__title">5 · 码窗进度</h2></header>
          <div class="card__body">
            <div class="rc-bar"><div class="rc-bar__fill" id="progress-bar"></div></div>
            <dl class="kv" id="progress-info"></dl>
          </div>
        </section>
      </main>
    </div>

    <div class="toast" id="toast"></div>

    <script>
      // 只加载引擎与协议：sender.html 的页面控制器不会在这里启动
      // （sender.js 内部检查 __ASQ_SENDER_PAGE__）
    </script>
    <script src="vendor/qrcode-generator.js"></script>
    <script src="vendor/jsQR.js"></script>
    <script src="core/protocol.js"></script>
    <script src="core/fountain.js"></script>
    <script src="core/qr.js"></script>
    <script src="core/scan.js"></script>
    <script src="core/codecs.js"></script>
    <script src="sender.js"></script>
    <script src="index.js"></script>
  </body>
</html>
